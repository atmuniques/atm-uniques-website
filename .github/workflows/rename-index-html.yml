name: Rename staged file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q index.html
          git mv atm-uniques-website-index-new.html index.html
          git rm -q .github/workflows/rename-index-html.yml
          git commit -m "Update website: 23 price fixes + 5 new products (100 total)"
          git push origin main
